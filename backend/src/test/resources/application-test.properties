# 테스트 전용 DB. 개발 DB(mes)와 섞이지 않게 따로 둔다.
# 계정 · 비밀번호는 application.properties 값을 그대로 쓴다(URL만 바꾼다).
spring.datasource.url=jdbc:postgresql://localhost:5432/mes_test

# 1분 요약 작업(플러시 · 아카이브 · 복구)을 끈다. 테스트는 SensorRollupService를 직접 부른다
mes.sensor.jobs=false
mes.sensor.spool-dir=build/test-sensor/spool
mes.sensor.archive-dir=build/test-sensor/archive
